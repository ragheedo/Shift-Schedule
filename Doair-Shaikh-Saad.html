<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الصيدليات المناوبة في دوير الشيخ سعد</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Arial', Tahoma, sans-serif; margin: 20px; background: #fff; }
        
        .setup-area { 
            background: #f8f9fa; 
            padding: 20px; 
            border: 1px solid #ddd; 
            margin-bottom: 25px; 
            border-radius: 8px; 
            text-align: center; 
        }

        table { width: 100%; border-collapse: collapse; border: 2.5px solid black; }
        td, th { border: 1.5px solid black; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold; }
        
        .time-header-row, .friday-header-row { background-color: #2c3e50 !important; color: #fff !important; font-size: 15px; height: 40px; }
        .time-header-row td, .friday-header-row td { border: 2px solid black; }

        .ph-name { width: 150px; font-size: 15px; color: #000; }
        .ph-loc { font-size: 15px; color: #333; font-weight: bold; }

        .day-cell, .date-cell { width: 45px !important; background-color: #fff !important; }

        [contenteditable="true"]:hover { background-color: rgba(255,255,255,0.5); cursor: text; }
        [contenteditable="true"]:focus { outline: 2px solid #3498db; background: rgba(52,152,219,0.05); }

        .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: 16px; }

        .day-sat { background-color: #e3f2fd !important; }
        .day-sun { background-color: #fce4ec !important; }
        .day-mon { background-color: #f1f8e9 !important; }
        .day-tue { background-color: #ede7f6 !important; }
        .day-wed { background-color: #e0f2f1 !important; }
        .day-thu { background-color: #fff3e0 !important; }
        .day-fri { background-color: #fff9c4 !important; }
        /* خط فاصل عريض بين مجموعتي الجمعة */
        .fri-group2 { border-right: 3px solid black !important; }
        /* خط فاصل عريض بين الأيام */
        .day-last-row td { border-bottom: 3px solid black !important; }

        .actions { text-align: center; margin-top: 20px; }
        button { background: #2c3e50; color: #fff; padding: 10px 25px; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; margin: 5px; }
        .btn-excel { background: #27ae60; }
        .btn-print { background: #8e44ad; }
        .edit-hint { color: #e67e22; font-size: 14px; margin-bottom: 10px; display: block; text-align: center; }

        /* ===== نافذة اختيار الأسبوع ===== */
        #printModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #printModal.open { display: flex; }

        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 30px 35px;
            min-width: 360px;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            direction: rtl;
        }
        .modal-box h2 { margin: 0 0 8px; font-size: 22px; color: #2c3e50; }
        .modal-box p { color: #666; font-size: 14px; margin-bottom: 20px; }

        .week-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 340px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 4px 2px;
        }
        .week-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f4f6f8;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: right;
        }
        .week-item:hover { background: #e8f4fd; border-color: #3498db; }
        .week-item.selected { background: #d6eaf8; border-color: #2980b9; }
        .week-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #2980b9; flex-shrink: 0; }
        .week-label { font-size: 15px; font-weight: bold; color: #2c3e50; }
        .week-dates { font-size: 12px; color: #777; margin-top: 2px; }

        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-actions button { margin: 0; font-size: 15px; padding: 10px 22px; }
        .btn-cancel { background: #95a5a6; }
        .btn-confirm-print { background: #8e44ad; }

        .select-all-row {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 14px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 6px;
            font-size: 14px; color: #555; cursor: pointer;
        }
        .select-all-row input { width: 16px; height: 16px; accent-color: #2980b9; }

        /* ===== طباعة ===== */
        #printContainer { display: none; }

        @media print {
            .setup-area, .actions, .edit-hint, #printModal, #scheduleTable { display: none !important; }

            @page {
                size: A4 portrait;
                margin: 6mm 7mm;
            }

            html, body { margin: 0; height: 100%; }
            #printContainer { display: block; }

            .print-week-block {
                page-break-after: always;
                page-break-inside: avoid;
                width: 100%;
                min-height: calc(297mm - 12mm);
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
            }
            .print-week-block:last-child { page-break-after: auto; }

            .print-header {
                text-align: center;
                font-size: 18px;
                font-weight: bolder;
                font-family: 'Arial', Tahoma, sans-serif;
                padding: 4px 0;
                border-top: 2px solid black;
                border-bottom: 2px solid black;
                flex-shrink: 0;
                margin-bottom: 0;
            }

            .print-week-block table {
                width: 100%;
                border-collapse: collapse;
                border: 2px solid black;
                flex: 1;
                table-layout: fixed;
            }

            .print-week-block td, .print-week-block th {
                border: 1px solid black;
                padding: 1px 2px;
                text-align: center;
                vertical-align: middle;
                font-weight: bold;
                word-break: break-word;
                background-color: #fff !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .friday-header-row td{
                border: 3px solid black;
            }
            .time-header-row td{
                border-right: 3px solid black;
                border-bottom: 3px solid black;
                border-left: 3px solid black;
            }

            .print-week-block .time-header-row td,
            .print-week-block .friday-header-row td {
                color: #000 !important;
                background-color: #fff !important;
                font-size: 15px;
                font-weight: bolder;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* عمود اليوم والتاريخ — يتحكم بهم colgroup */
            .print-week-block .day-cell {
                padding: 10px !important;
                background-color: #fff !important;
                overflow: hidden;
            }
            .print-week-block .date-cell {
                padding: 9px !important;
                background-color: #fff !important;
                overflow: hidden;
            }

            .print-week-block .vertical-text {
                writing-mode: vertical-rl;
                transform: rotate(180deg);
                white-space: nowrap;
                font-size: 18px;
                font-weight: bold;
            }

            /* اسم الصيدلية */
            .print-week-block .ph-name {
                font-size: 17px !important;
                font-weight: bold;
                color: #000 !important;
            }

            /* عنوان/موقع الصيدلية */
            .print-week-block .ph-loc {
                font-size: 17px !important;
                font-weight: bold;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <div class="setup-area">
        <label>من تاريخ:</label> <input type="date" id="startInput" value="2026-04-04">
        <label>إلى تاريخ:</label> <input type="date" id="endInput">
        <label>ابدأ بالمجموعة:</label> <input type="number" id="startGroup" value="1" min="1" style="width: 60px;">
        <button onclick="buildTable()">توليد الجدول</button>
    </div>

    <span class="edit-hint">* يمكنك الضغط على أي خلية لتعديلها يدوياً.</span>

    <table id="scheduleTable">
        <tbody></tbody>
    </table>

    <!-- حاوية الطباعة - تُبنى ديناميكياً -->
    <div id="printContainer"></div>

    <div class="actions">
        <button class="btn-excel" onclick="exportToExcel()">تحميل Excel</button>
        <button class="btn-print" onclick="openPrintModal()">🖨️ طباعة الجدول</button>
    </div>

    <!-- نافذة اختيار الأسبوع -->
    <div id="printModal">
        <div class="modal-box">
            <h2>🖨️ اختر الأسبوع للطباعة</h2>
            <p>كل أسبوع سيُطبع في صفحة مستقلة</p>
            <div class="select-all-row" onclick="toggleSelectAll()">
                <input type="checkbox" id="selectAllChk">
                <span>تحديد الكل</span>
            </div>
            <div class="week-list" id="weekList"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closePrintModal()">إلغاء</button>
                <button class="btn-confirm-print" onclick="confirmPrint()">طباعة المحدد</button>
            </div>
        </div>
    </div>

    <script>
        const dayClasses = ["day-sun", "day-mon", "day-tue", "day-wed", "day-thu", "day-fri", "day-sat"];

        // تتبع الأسابيع
        let weekMeta = []; // [{label, startDate, endDate, startDateObj, endDateObj, rowIndices:[]}]

        async function buildTable() {
            try {
                const res = await fetch('doair-shaikh-saad.json');
                const groups = await res.json();
                
                const startVal = document.getElementById('startInput').value;
                const endVal = document.getElementById('endInput').value;
                let groupCounter = parseInt(document.getElementById('startGroup').value) - 1; 

                if (!startVal || !endVal) return alert("يرجى اختيار التواريخ");

                const tbody = document.querySelector('#scheduleTable tbody');
                tbody.innerHTML = "";
                weekMeta = [];

                let current = new Date(startVal);
                const endLimit = new Date(endVal);
                let needNormalHeader = true;
                let isFirstLoop = true;
                let currentWeekIdx = -1;

                while (current <= endLimit) {
                    const dayIndex = current.getDay();
                    const dayName = current.toLocaleDateString('ar-EG', {weekday: 'long'});
                    const dateStr = `${current.getFullYear()}/${(current.getMonth()+1).toString().padStart(2,'0')}/${current.getDate().toString().padStart(2,'0')}`;
                    const rowClass = dayClasses[dayIndex];

                    // بداية أسبوع جديد: كل سبت أو أول يوم
                    const isWeekStart = (dayIndex === 6) || isFirstLoop;
                    if (isWeekStart) {
                        currentWeekIdx++;
                        const weekStartObj = new Date(current);
                        let weekEndObj = new Date(current);
                        if (dayIndex === 6) {
                            weekEndObj.setDate(weekEndObj.getDate() + 6);
                        } else {
                            const daysToFri = (5 - dayIndex + 7) % 7;
                            weekEndObj.setDate(weekEndObj.getDate() + daysToFri);
                        }
                        if (weekEndObj > endLimit) weekEndObj = new Date(endLimit);

                        weekMeta.push({
                            label: `الأسبوع ${currentWeekIdx + 1}`,
                            startDate: formatDate(weekStartObj),
                            endDate: formatDate(weekEndObj),
                            startDateObj: weekStartObj,
                            endDateObj: weekEndObj,
                            rowIndices: []
                        });
                        needNormalHeader = true;
                    }

                    if (dayIndex !== 5) {
                        // أيام الأحد - الخميس + السبت
                        if (needNormalHeader) {
                            const hRow = tbody.insertRow();
                            hRow.className = "time-header-row";
                            hRow.dataset.week = currentWeekIdx;
                            weekMeta[currentWeekIdx].rowIndices.push(hRow.rowIndex);
                            hRow.innerHTML = `<td colspan="6" contenteditable="true">من الساعة 8:00 مساء لغاية الساعة 12:00 ليلا</td>`;
                            needNormalHeader = false;
                        }

                        const g = groups[groupCounter % groups.length]; groupCounter++;
                        const phars = g.pharmacies || [];

                        for (let i = 0; i < 2; i++) {
                            const row = tbody.insertRow();
                            row.classList.add(rowClass);
                            row.dataset.week = currentWeekIdx;
                            weekMeta[currentWeekIdx].rowIndices.push(row.rowIndex);
                            if (i === 1) row.classList.add('day-last-row');

                            if (i === 0) {
                                row.innerHTML = `
                                    <td rowspan="2" class="day-cell"><div class="vertical-text">${dayName}</div></td>
                                    <td rowspan="2" class="date-cell"><div class="vertical-text">${dateStr}</div></td>
                                `;
                            }
                            addCell(row, phars[i], "name", 1);
                            addCell(row, phars[i], "loc", 3);
                        }
                    } else {
                        // الجمعة
                        needNormalHeader = true;
                        const hRow = tbody.insertRow();
                        hRow.className = "friday-header-row";
                        hRow.dataset.week = currentWeekIdx;
                        weekMeta[currentWeekIdx].rowIndices.push(hRow.rowIndex);
                        hRow.innerHTML = `
                            <td colspan="4" contenteditable="true">من الساعة 8:00 صباحا لغاية الساعة 4:00 مساء</td>
                            <td colspan="2" contenteditable="true">من الساعة 4:00 مساء لغاية الساعة 12:00 ليلا</td>
                        `;

                        const g1 = groups[groupCounter % groups.length]; groupCounter++;
                        const g2 = groups[groupCounter % groups.length]; groupCounter++;
                        const p1 = g1.pharmacies || [];
                        const p2 = g2.pharmacies || [];

                        for (let i = 0; i < 2; i++) {
                            const row = tbody.insertRow();
                            row.classList.add(rowClass);
                            row.dataset.week = currentWeekIdx;
                            weekMeta[currentWeekIdx].rowIndices.push(row.rowIndex);
                            if (i === 1) row.classList.add('day-last-row');

                            if (i === 0) {
                                row.innerHTML = `
                                    <td rowspan="2" class="day-cell"><div class="vertical-text">الجمعة</div></td>
                                    <td rowspan="2" class="date-cell"><div class="vertical-text">${dateStr}</div></td>
                                `;
                            }
                            addCell(row, p1[i], "name", 1);
                            addCell(row, p1[i], "loc", 1);
                            addCell(row, p2[i], "name", 1, "fri-group2");
                            addCell(row, p2[i], "loc", 1);
                        }
                    }

                    isFirstLoop = false;
                    current.setDate(current.getDate() + 1);
                }
            } catch (e) {
                alert("تأكد من وجود ملف pharmaciessss.json — خطأ: " + e.message);
            }
        }

        function formatDate(d) {
            return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
        }

        function addCell(row, phar, type, span, extraClass = "") {
            const cell = row.insertCell();
            cell.colSpan = span;
            cell.className = type === "name" ? "ph-name" : "ph-loc";
            if (extraClass) cell.classList.add(extraClass);
            cell.innerText = phar ? (phar[type] || "---") : "---";
            cell.contentEditable = "true";
        }

        // ===== منطق نافذة الطباعة =====

        function openPrintModal() {
            if (weekMeta.length === 0) return alert("يرجى توليد الجدول أولاً.");
            const list = document.getElementById('weekList');
            list.innerHTML = '';
            weekMeta.forEach((w, i) => {
                const item = document.createElement('div');
                item.className = 'week-item';
                item.dataset.idx = i;
                item.innerHTML = `
                    <input type="checkbox" id="wk${i}" value="${i}" onchange="updateItemStyle(this)">
                    <div>
                        <div class="week-label">${w.label}</div>
                        <div class="week-dates">من ${w.startDate} إلى ${w.endDate}</div>
                    </div>
                `;
                item.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'INPUT') {
                        const chk = this.querySelector('input');
                        chk.checked = !chk.checked;
                        updateItemStyle(chk);
                    }
                    updateSelectAll();
                });
                list.appendChild(item);
            });
            document.getElementById('selectAllChk').checked = false;
            document.getElementById('printModal').classList.add('open');
        }

        function updateItemStyle(chk) {
            chk.closest('.week-item').classList.toggle('selected', chk.checked);
            updateSelectAll();
        }

        function updateSelectAll() {
            const all = document.querySelectorAll('#weekList input[type="checkbox"]');
            const checked = document.querySelectorAll('#weekList input[type="checkbox"]:checked');
            document.getElementById('selectAllChk').checked = all.length > 0 && all.length === checked.length;
        }

        function toggleSelectAll() {
            const masterChk = document.getElementById('selectAllChk');
            masterChk.checked = !masterChk.checked;
            document.querySelectorAll('#weekList input[type="checkbox"]').forEach(chk => {
                chk.checked = masterChk.checked;
                updateItemStyle(chk);
            });
        }

        function closePrintModal() {
            document.getElementById('printModal').classList.remove('open');
        }

        // أسماء الأشهر السريانية
        const arabicMonths = ["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];

        function getMonthLabel(w) {
            const sm = w.startDateObj.getMonth();
            const sy = w.startDateObj.getFullYear();
            const em = w.endDateObj.getMonth();
            const ey = w.endDateObj.getFullYear();
            if (sm === em && sy === ey) {
                return `الصيدليات المناوبة في دوير الشيخ سعد خلال شهر ${arabicMonths[sm]} ${sy}`;
            } else if (sy === ey) {
                return `الصيدليات المناوبة في دوير الشيخ سعد خلال شهري ${arabicMonths[sm]} و${arabicMonths[em]} ${sy}`;
            } else {
                return `الصيدليات المناوبة في دوير الشيخ سعد خلال شهري ${arabicMonths[sm]} ${sy} و${arabicMonths[em]} ${ey}`;
            }
        }

        function confirmPrint() {
            const selected = [...document.querySelectorAll('#weekList input[type="checkbox"]:checked')]
                .map(c => parseInt(c.value));

            if (selected.length === 0) return alert("يرجى تحديد أسبوع واحد على الأقل.");

            const container = document.getElementById('printContainer');
            container.innerHTML = '';
            const tbody = document.querySelector('#scheduleTable tbody');

            selected.sort((a, b) => a - b).forEach(weekIdx => {
                const w = weekMeta[weekIdx];

                const block = document.createElement('div');
                block.className = 'print-week-block';

                // الترويسة
                const header = document.createElement('div');
                header.className = 'print-header';
                header.textContent = getMonthLabel(w);
                block.appendChild(header);

                // الجدول
                const tbl = document.createElement('table');

                // colgroup لتحديد عرض الأعمدة بدقة:
                // اليوم | التاريخ | اسم1 | موقع1 | اسم2 | موقع2
                const colgroup = document.createElement('colgroup');
                ['11mm', '11mm', '25mm', 'auto', '25mm', 'auto'].forEach(cw => {
                    const col = document.createElement('col');
                    col.style.width = cw;
                    colgroup.appendChild(col);
                });
                tbl.appendChild(colgroup);

                const tb = document.createElement('tbody');
                w.rowIndices.forEach(rowIndex => {
                    const origRow = tbody.rows[rowIndex];
                    if (!origRow) return;
                    tb.appendChild(origRow.cloneNode(true));
                });
                tbl.appendChild(tb);
                block.appendChild(tbl);
                container.appendChild(block);
            });

            closePrintModal();
            window.print();

            setTimeout(() => { container.innerHTML = ''; }, 2000);
        }

        function exportToExcel() {
            const table = document.getElementById("scheduleTable");
            const wb = XLSX.utils.table_to_book(table);
            XLSX.writeFile(wb, "جدول_المناوبات_النهائي.xlsx");
        }
    </script>
</body>
</html>
